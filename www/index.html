<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <meta name="description" content="PitHub · 家庭私有微型服务器：FilePit、PhotoNode、ClipHub、DashLink">
  <title>PitHub · 家庭私有云</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('pithub_theme') || 'auto';
        var light = window.matchMedia('(prefers-color-scheme: light)').matches;
        var theme = saved === 'auto' ? (light ? 'light' : 'dark') : saved;
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app" class="min-h-screen">
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl flex items-center justify-center mb-4" style="background:rgba(91,141,239,.16);color:#5b8def">
          <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/>
            <path d="M7 7.5h.01M7 16.5h.01"/>
          </svg>
        </div>
        <div class="text-[1rem] font-semibold" style="color:var(--text)">PitHub</div>
        <div class="text-[0.7rem] mt-1" style="color:var(--muted)">正在连接本机服务…</div>
      </div>
    </div>
  </div>
  <div id="toast-root" class="toast-root fixed top-4 right-4 z-[100] flex flex-col items-end gap-2"></div>
  <div id="modal-root"></div>
  <script src="assets/config.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
